---
- hosts: webservers
  become: True
  tasks:
    - name: Install Apache
      apt:
        name: apache2
        state: present

    - name: Start Apache service
      service:
        name: apache2
        state: started

    - name: Copy index.html to web server root
      copy:
        src: index.html
        dest: /var/www/html/

    - name: Ensure firewall is configured to allow HTTP traffic
      ufw:
        rule: allow
        port: 80
        proto: tcp

---

